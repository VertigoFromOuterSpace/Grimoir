[workspace]
resolver = "3"
members = [
    "crates/grimoir",
    "crates/grimoir-library",
    "crates/grimoir-pdf",
    "crates/grimoir-theme",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/VertigoFromOuterSpace/Grimoir"

[workspace.dependencies]
anyhow = "1.0"
async-channel = "2.5"
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
html2text = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
notify = "8.2"
pdfium-render = "0.9.5"
rayon = "1.10"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
